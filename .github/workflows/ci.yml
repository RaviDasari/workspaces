name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: ws is built from src/
        run: ./build.sh --check
      - name: Smoke test
        run: tests/smoke.sh
      - name: Smoke test under macOS /bin/bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash tests/smoke.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck build.sh tests/smoke.sh src/*.sh

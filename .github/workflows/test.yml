name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test
        run: tests/smoke.sh
      - name: Smoke test under macOS /bin/bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash tests/smoke.sh
